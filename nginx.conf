server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text, code, and SVG assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # PMTiles vector tiles with HTTP 206 Range request support & CORS
    location ~* \.pmtiles$ {
        # PMTiles rely on HTTP Range requests; keep gzip off to preserve byte offsets
        gzip off;
        default_type application/vnd.pmtiles-tile;
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";

        if ($request_method = "OPTIONS") {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }
    }

    # Static assets caching & MIME types (.js -> application/javascript, .css -> text/css)
    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, no-transform";
        access_log off;
    }

    # HTML SPA entry caching (no-cache for instant updates)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container healthcheck endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Deny access to hidden dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
